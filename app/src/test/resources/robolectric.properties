# Robolectric defaults to the module's targetSdk, which is 36. Robolectric 4.15.1 ships Android
# images up to API 35, so leaving this unset fails every test in this source set with
# "Failed to create a Robolectric sandbox: Unsupported class file major version" long before any
# assertion runs -- a build-configuration error wearing a test failure's clothes.
#
# 35 is therefore a ceiling imposed by the tool, not a considered choice, and it is worth raising
# the moment Robolectric ships API 36. What these tests assert -- layout geometry under a reported
# IME inset -- does not vary across those two API levels; what does vary is whether the platform
# reports IME insets at all rather than resizing the window, and no Robolectric SDK level can
# exercise that. See the `Compose IME insets` note in AGENTS.md section 7.
sdk=35

# Robolectric's default screen is 320x470dp at mdpi, which is smaller than any phone this app runs
# on and small enough to make an occlusion test meaningless: a 300dp keyboard would leave 170dp of
# usable height, so screens would overflow it whether or not they handled the inset correctly, and
# the harness would report failures that say nothing about the code.
#
# These qualifiers describe a Pixel-class phone -- 411x891dp at xxhdpi, so 1233x2673px, the same
# order as the 2280px-tall device PR #95's stranded FAB was measured on.
qualifiers=w411dp-h891dp-xxhdpi

# A bare Application, not MediaTrackerApplication.
#
# Robolectric instantiates whatever the merged manifest names, and this app's manifest names the
# real one -- whose onCreate configures AppLogger and starts applyPersistedLogVerbosity, which
# collects a Room Flow. That opens the database through the bundled SQLite driver and dies with
# "no sqliteJni in java.library.path", because the host JVM has no such native library.
#
# It is worth being precise about what went wrong, because the shape recurs. The failure is not
# deterministic: applyPersistedLogVerbosity runs in a launched coroutine, so whether it reaches the
# driver before the test finishes depends on how long the test takes. A first run of this harness
# against a smaller screen failed earlier for an unrelated reason and never got there -- so leaving
# the real Application in place would not have produced a broken lane, it would have produced an
# intermittent one, which is worse and is the exact failure mode #91 exists to describe.
#
# Screen-level tests here drive a stateless composable with fabricated state and fake callbacks
# (AGENTS.md section 7), so the app graph has no business booting at all. Note this means the lane
# says nothing about whether MediaTrackerApplication.onCreate is correctly wired -- still an open
# ROADMAP backlog item, and still not covered by anything.
application=android.app.Application
