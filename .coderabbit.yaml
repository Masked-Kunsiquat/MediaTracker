# CodeRabbit configuration.
#
# Release PRs are pure ritual (AGENTS.md §8): they only roll the CHANGELOG's
# [Unreleased] section into a dated version heading and bump `[versions] app` in
# gradle/libs.versions.toml. There is no code to review, and every one of them
# spends review quota that is better kept for the feature PRs. They are always
# titled "Release vX.Y.Z", so skipping on that title keyword is reliable.
#
# Feature PRs are deliberately left fully reviewed.
reviews:
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "Release v"

  # TEMPORARY (#231, PR #235): that PR changes 120 files, over CodeRabbit's 100-file
  # limit, so it was skipped outright. Leaving out tests, the plan/spec and the schema
  # JSON brings it to ~63 files of production code. Remove this block once #235 merges.
  path_filters:
    - "!**/src/test/**"
    - "!**/src/jvmTest/**"
    - "!**/src/commonTest/**"
    - "!**/src/androidTest/**"
    - "!docs/superpowers/**"
    - "!shared/schemas/**"
