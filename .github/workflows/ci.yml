name: CI

# Runs on every pull request and on pushes to main. Nothing else in this repository runs the test
# suite -- before this workflow existed it ran only when a developer remembered to, which is how a
# build reported as green while a resource failure had actually failed it (the check was a grep
# that matched Kotlin errors only). A workflow does not grep; it exits non-zero.
on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs for the same branch: a force-push or a quick follow-up commit makes the
# earlier run's result meaningless, and leaving it queued only slows the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this the workflow inherits whatever the repository default is, which can
# be read/write -- more than a build that only ever reads the tree needs, and more than should be
# handed to the arbitrary third-party code a Gradle build resolves and executes.
permissions:
  contents: read

jobs:
  changelog:
    name: Changelog check
    runs-on: ubuntu-latest
    # Only run on PRs. Pushes to main (like release tags) are already verified or follow 
    # the release ritual which includes a changelog update.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 is required to compare against the base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CHANGELOG.md update
        run: |
          # Fetch the base branch so we can diff against it
          git fetch origin ${{ github.base_ref }} --depth=1

          # Get the list of files changed in this PR compared to the target branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          # Check if code in shared/ or app/src/main/ was touched
          CODE_TOUCHED=$(echo "$CHANGED_FILES" | grep -E '^(shared/|app/src/main/)' || true)
          
          # Check if CHANGELOG.md was touched
          CHANGELOG_TOUCHED=$(echo "$CHANGED_FILES" | grep -q '^CHANGELOG.md$' && echo "true" || echo "false")
          
          if [ -n "$CODE_TOUCHED" ] && [ "$CHANGELOG_TOUCHED" = "false" ]; then
            echo "::error::Code changes detected in shared/ or app/src/main/ but CHANGELOG.md was not updated."
            echo "AGENTS.md §8 requires an [Unreleased] entry for every completed task or phase."
            echo "Modified code files:"
            echo "$CODE_TOUCHED"
            exit 1
          fi

  room-schema:
    name: Room schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Room schema version consistency
        run: |
          SCHEMA_DIR="shared/schemas/com.hub.media.core.database.AppDatabase"
          DATABASE_FILE="shared/src/commonMain/kotlin/com/hub/media/core/database/AppDatabase.kt"
          
          # Extract version from AppDatabase.kt
          CODE_VERSION=$(grep "public const val APP_DATABASE_VERSION: Int =" "$DATABASE_FILE" | sed 's/.*= //')
          echo "APP_DATABASE_VERSION in code: $CODE_VERSION"
          
          # Find max version in schemas directory
          MAX_SCHEMA_VERSION=$(ls "$SCHEMA_DIR" | grep -E '^[0-9]+\.json$' | sed 's/\.json//' | sort -n | tail -1)
          echo "Max schema version in $SCHEMA_DIR: $MAX_SCHEMA_VERSION"
          
          if [ "$CODE_VERSION" != "$MAX_SCHEMA_VERSION" ]; then
            echo "::error::APP_DATABASE_VERSION ($CODE_VERSION) does not match the latest exported schema ($MAX_SCHEMA_VERSION.json)."
            echo "If you changed the schema, you must bump APP_DATABASE_VERSION and ensure the new schema is exported to $SCHEMA_DIR."
            exit 1
          fi

      - name: Verify frozen schemas are untouched
        if: github.event_name == 'pull_request'
        run: |
          SCHEMA_DIR="shared/schemas/com.hub.media.core.database.AppDatabase"
          
          # Fetch the base branch
          git fetch origin ${{ github.base_ref }} --depth=1
          
          # Get list of schema files in the base branch
          FROZEN_SCHEMAS=$(git ls-tree -r --name-only origin/${{ github.base_ref }} "$SCHEMA_DIR" | grep -E '\/[0-9]+\.json$')
          
          # Check if any of these were modified in the PR
          MODIFIED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          for schema in $FROZEN_SCHEMAS; do
            if echo "$MODIFIED_FILES" | grep -q "^$schema$"; then
              echo "::error::Frozen Room schema file modified: $schema"
              echo "AGENTS.md §8: 'Once a release is tagged, the database schema shipped in it is FROZEN.'"
              echo "Existing schema JSONs must never be modified. If you need a schema change, bump APP_DATABASE_VERSION instead."
              exit 1
            fi
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, deliberately -- not just this PR's commits. A secret is compromised from
          # the moment it is pushed; rebasing the branch or squashing on merge does not unpublish
          # it, and a diff-scoped scan would miss one that arrived via a rebase or came in from
          # another branch. The whole history of this repository scans in about two seconds, so
          # there is nothing to buy by narrowing it.
          fetch-depth: 0
          persist-credentials: false

      # `fetch-depth: 0` is full *depth*, not full *breadth*: checkout still fetches only the ref
      # under review and its base. The first run of this job scanned 110 commits where the whole
      # repository holds more, so a secret pushed to any other branch would have sat unscanned until
      # that branch happened to open a PR. On a public repository that gap is the whole risk -- the
      # value is readable the moment it is pushed, not when it is reviewed.
      #
      # gitleaks reads refs/remotes/* as well as refs/heads/*, verified: a secret reachable only
      # from a remote-tracking ref is still reported. So fetching every head and tag is enough to
      # make the scan below cover the repository rather than the branch.
      #
      # Unauthenticated, because persist-credentials is false above and this repository is public.
      # Were it ever made private this step would fail rather than silently narrow, and the
      # tooling-failure message at the end makes clear that a failure here is not a leak report.
      - name: Fetch every branch and tag
        run: git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      # Pinned release binary rather than gitleaks-action, for two reasons. The action requires a
      # licence key for organisation-owned repositories, which is a dependency on this repository
      # staying personally owned. More importantly it is third-party code executing in the
      # workflow: this job exists to find credentials, so it is the last one that should run
      # something unpinned. The checksum is the 8.30.1 release's published digest -- if the asset
      # ever changes underneath the tag, this step fails rather than executing it.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL --fail -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      # A clean scan and a broken scanner produce the same green tick, which is the failure mode
      # AGENTS.md §7 exists to prevent: a check that cannot fail is worse than no check. So prove
      # detection still works against a known token before trusting the real result below.
      #
      # This is not hypothetical. The first version of this control was written with
      # AKIAIOSFODNN7EXAMPLE, which is AWS's own documentation key and is allowlisted by gitleaks --
      # it reported "no leaks found" and proved nothing. Stopwords do the same to anything built
      # from "test" or "example", both verified silently undetected.
      - name: Prove the scanner still detects
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/gitleaks-selftest"
          rm -rf "$FIXTURE" && mkdir -p "$FIXTURE" && cd "$FIXTURE"
          git init -q -b main .

          # Derived at runtime, because no secret-shaped literal can live in this file: the real
          # scan below reads this file's own history. Splitting a token across two fragments is not
          # enough either -- that evades the github-pat rule but `TOKEN="..."` then trips
          # generic-api-key on the assignment shape, which is how the first attempt at this failed.
          # A hash of a fixed phrase is deterministic (no flaky check) and looks like nothing.
          SUFFIX=$(printf 'mediatracker-gitleaks-selftest' | sha256sum | tr -dc 'a-f0-9' | cut -c1-36)
          printf 'token = "ghp_%s"\n' "$SUFFIX" > fixture.txt
          git add -A
          git -c user.email=ci@example.invalid -c user.name=ci commit -q -m 'self-test fixture'

          if "$RUNNER_TEMP/gitleaks" git . --redact --no-banner \
               --report-format json --report-path out.json; then
            echo "::error::gitleaks called a fixture containing a known token clean."
            echo "Detection is broken, so a green result from the real scan would mean nothing."
            exit 1
          fi
          grep -q '"RuleID"' out.json
          grep -q 'github-pat' out.json
          # --redact is load-bearing on a public repository (see the real scan below), so assert it
          # rather than assuming the flag still behaves as it did.
          if grep -q "ghp_$SUFFIX" out.json; then
            echo "::error::--redact failed: the fixture token appears verbatim in the report."
            exit 1
          fi
          echo "Detection, reporting and redaction all confirmed working."

      # .gitignore only stops an accidental `git add` of a file that is not yet tracked, and gitleaks
      # cannot help here either -- a keystore is opaque binary with no pattern to match. Neither
      # notices a credential file that is already tracked, so check the history by name.
      - name: Verify no credential files have ever been committed
        run: |
          set -euo pipefail
          # Every path any commit ever touched, deliberately unfiltered by change type. An earlier
          # version restricted this to --diff-filter=A and missed the case that matters most: git
          # records a rename as R, not A, so a keystore committed as `app.bin` and renamed to
          # `release.jks` never appears as an addition under the name being matched. Verified.
          COMMITTED=$(git log --all --pretty=format: --name-only \
            | sort -u \
            | grep -E '\.(jks|keystore|p12)$|(^|/)keystore\.properties$' || true)
          if [ -n "$COMMITTED" ]; then
            echo "::error::A credential file has been committed at some point in this history."
            echo "$COMMITTED"
            echo "Deleting it now does not help -- it stays in the history. An app signing key in"
            echo "particular cannot be rotated: treat it as compromised and generate a new one."
            exit 1
          fi

      # --redact is not optional here. This repository is public, so its Actions logs are public:
      # without it, a detected secret gets printed in full to a world-readable log, and the scan
      # meant to catch the leak becomes a second, more visible copy of it.
      #
      # JSON rather than SARIF: gitleaks' SARIF carries partialFingerprints.commitSha but not the
      # `commit:file:rule-id:start-line` fingerprint that .gitleaksignore actually takes, so it
      # cannot answer the one question a reader has at that point. The JSON report has it whole, in
      # a Fingerprint field, ready to paste.
      - name: Scan git history for secrets
        id: scan
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-findings.json

      # Gated on the scan specifically, not on the job: an earlier step failing means there is no
      # report to upload. A bare `if: failure()` here would try regardless.
      - name: Upload findings
        if: failure() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-findings
          path: gitleaks-findings.json
          retention-days: 7

      # A hit is not a "fix the file and move on" situation, so say so at the point of failure
      # rather than leaving it to be worked out from a red X.
      - name: Explain a credential finding
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::gitleaks found a credential in the repository's history."
          echo "Removing it in a new commit is NOT sufficient -- the value stays in the history and"
          echo "must be treated as compromised. Rotate the credential first, then decide whether the"
          echo "history needs rewriting."
          echo "If it is a false positive: each finding in the uploaded gitleaks-findings.json has a"
          echo "Fingerprint field, formatted commit:file:rule-id:start-line. Paste that whole value"
          echo "into .gitleaksignore, one per line, with a comment saying why the match is safe."

      # Distinct from the message above, and deliberately so: telling someone a credential leaked
      # when the download merely 404'd sends them rotating keys for no reason.
      - name: Explain a tooling failure
        if: failure() && steps.scan.outcome != 'failure'
        run: |
          echo "::error::The secret scan did not complete. This is NOT a report of a leak."
          echo "Something before the scan failed -- the download, the checksum check, the detection"
          echo "self-test, or the credential-filename check. Read the failing step above. Nothing"
          echo "here says anything either way about whether this repository contains a secret."

  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for the rest of the job. A Gradle build runs
          # plugin and dependency code this repository does not own, and nothing here needs to push
          # or call the API, so the credential should not be sitting on disk while that runs.
          persist-credentials: false

      # JDK 21: shared/ and app/ both set jvmToolchain(21). The Kotlin jvmTarget is 11, which is a
      # separate setting -- the toolchain is what Gradle needs to *run* the compiler.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk is 36 (minorApiLevel 1), which is newer than the runner image is guaranteed to
      # keep shipping. Named explicitly rather than relying on the image happening to include it:
      # the first version of this step only passed because it currently does, which is precisely
      # what breaks silently when GitHub rotates images.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The authoritative gate, exactly as AGENTS.md §7 specifies it. :shared:jvmTest is not
      # optional here: every Room-touching test is excluded from the androidUnitTest variants (see
      # shared/build.gradle.kts), so testDebugUnitTest alone would pass while skipping the whole
      # data layer.
      - name: Run unit tests
        run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest

      # Catches what unit tests never can: a malformed res/xml rule, a broken manifest merge, a
      # missing string resource. Every one of those has happened in this repository.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Kotlin linting (ktlint) for both shared and app modules.
      - name: Run ktlint
        run: ./gradlew ktlintCheck

      # Android Lint for the app module.
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
          retention-days: 7

      # Only on failure -- a green run's reports are noise, but a red one is very hard to diagnose
      # from log output alone.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7
